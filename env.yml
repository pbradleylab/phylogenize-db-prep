name: phylogenize-pipeline
variables:
  CONDA_SOLVER: libmamba
  CONDA_CHANNEL_PRIORITY: strict
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Snakemake requires pandas <3 and packaging <26; newer Conda needs packaging >=26.3.
  - python=3.14.10
  - snakemake=9.27.2
  # Interface-common 1.23.1 requires packaging >=26.1, conflicting with Snakemake.
  - snakemake-interface-common=1.23.0
  - conda=26.7.3
  - eido=0.2.6
  - peppy=0.40.8
  - pandas<3
