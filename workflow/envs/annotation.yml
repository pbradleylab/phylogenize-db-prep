name: anvio
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Keep the numerical stack required by the amino-acid-contig Anvi'o fork.
  - python=3.10
  - numpy=1.24.1
  - pandas=1.4.4
  - matplotlib-base=3.5.1
  - scikit-learn=1.2.2
  - pulp=2.7.0
  - hmmer=3.4
  - seqkit=2.14.0
  - prodigal=2.6.3
  - wget=1.25.0
  - pip=26.2.1
  # Anvi'o imports pkg_resources, removed in setuptools 82.
  - setuptools=81.0.0
  - wheel=0.48.0
  - git=2.56.0
  - polars=1.44.1
  - scipy=1.15.2
  - bottle=0.13.4
  - pysam=0.24.1
  - ete3=3.1.3
  - django=5.2.19
  - requests=2.34.2
  - mistune=3.3.4
  - six=1.17.0
  - statsmodels=0.15.0
  - colored=2.3.2
  - illumina-utils=2.14
  - tabulate=0.10.0
  - rich-argparse=1.8.0
  - numba=0.67.0
  - paste=3.10.1
  - pyani=0.2.13.1
  - psutil=7.2.2
  # Anvi'o's Python 3.10 environment needs the last Snakemake 7 release.
  - snakemake-minimal=7.32.4
  - multiprocess=0.70.19
  - plotext=5.3.2
  - networkx=3.4
  - biopython=1.88
  - reportlab=5.0.1
  - pymupdf=1.28.0
